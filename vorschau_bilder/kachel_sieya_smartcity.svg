<svg viewBox="0 0 976 618" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="himmel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="55%" stop-color="#141450"/>
      <stop offset="100%" stop-color="#0d2b3a"/>
    </linearGradient>
    <linearGradient id="glueh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e6b8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00e6b8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gebaeude" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2d55"/>
      <stop offset="100%" stop-color="#0f1a33"/>
    </linearGradient>
  </defs>

  <rect width="976" height="618" fill="url(#himmel)"/>
  <ellipse cx="488" cy="618" rx="520" ry="260" fill="url(#glueh)"/>

  <!-- Sterne -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="90" cy="70" r="2"/><circle cx="180" cy="120" r="1.5"/>
    <circle cx="300" cy="55" r="1.5"/><circle cx="620" cy="80" r="2"/>
    <circle cx="760" cy="130" r="1.5"/><circle cx="860" cy="60" r="2"/>
    <circle cx="920" cy="150" r="1.5"/><circle cx="420" cy="40" r="1.5"/>
  </g>

  <!-- Skyline -->
  <g fill="url(#gebaeude)">
    <rect x="0"   y="380" width="90"  height="238"/>
    <rect x="70"  y="300" width="70"  height="318"/>
    <rect x="150" y="420" width="60"  height="198"/>
    <rect x="210" y="340" width="85"  height="278"/>
    <rect x="300" y="260" width="95"  height="358"/>
    <rect x="400" y="360" width="70"  height="258"/>
    <rect x="475" y="230" width="110" height="388"/>
    <rect x="595" y="330" width="80"  height="288"/>
    <rect x="680" y="380" width="65"  height="238"/>
    <rect x="750" y="290" width="90"  height="328"/>
    <rect x="845" y="400" width="70"  height="218"/>
    <rect x="915" y="350" width="61"  height="268"/>
  </g>

  <!-- Fenster, leuchtend tuerkis -->
  <g fill="#5ff2d6">
    <rect x="80"  y="320" width="10" height="14"/><rect x="100" y="320" width="10" height="14"/>
    <rect x="80"  y="350" width="10" height="14"/><rect x="100" y="350" width="10" height="14"/>
    <rect x="80"  y="380" width="10" height="14"/><rect x="100" y="380" width="10" height="14"/>
    <rect x="320" y="290" width="12" height="16"/><rect x="345" y="290" width="12" height="16"/>
    <rect x="320" y="330" width="12" height="16"/><rect x="345" y="330" width="12" height="16"/>
    <rect x="320" y="370" width="12" height="16"/><rect x="345" y="370" width="12" height="16"/>
    <rect x="500" y="260" width="12" height="16"/><rect x="525" y="260" width="12" height="16"/>
    <rect x="550" y="260" width="12" height="16"/>
    <rect x="500" y="300" width="12" height="16"/><rect x="525" y="300" width="12" height="16"/>
    <rect x="550" y="300" width="12" height="16"/>
    <rect x="500" y="340" width="12" height="16"/><rect x="525" y="340" width="12" height="16"/>
    <rect x="550" y="340" width="12" height="16"/>
    <rect x="770" y="320" width="10" height="14"/><rect x="795" y="320" width="10" height="14"/>
    <rect x="770" y="350" width="10" height="14"/><rect x="795" y="350" width="10" height="14"/>
  </g>

  <!-- Windrad, fuer "smart"/erneuerbar -->
  <g stroke="#5ff2d6" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="860" y1="230" x2="860" y2="300"/>
    <line x1="860" y1="235" x2="890" y2="215"/>
    <line x1="860" y1="235" x2="833" y2="255"/>
    <line x1="860" y1="235" x2="878" y2="262"/>
  </g>

  <!-- Netzwerk-Linien zwischen den Gebaeuden -->
  <g stroke="#5ff2d6" stroke-width="1.5" opacity="0.45">
    <path d="M115 320 L345 290" />
    <path d="M357 300 L512 260" />
    <path d="M562 270 L780 320" />
  </g>
  <g fill="#5ff2d6" opacity="0.8">
    <circle cx="115" cy="320" r="3"/><circle cx="345" cy="290" r="3"/>
    <circle cx="512" cy="260" r="3"/><circle cx="780" cy="320" r="3"/>
  </g>

  <!-- Badge -->
  <rect x="28" y="28" width="150" height="34" rx="17" fill="#0a1a2e" opacity="0.55"/>
  <text x="103" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#5ff2d6" letter-spacing="0.5">SMART CITY</text>
</svg>
